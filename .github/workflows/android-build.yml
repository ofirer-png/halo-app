name: Build Halo IM Android APK

# Builds the Halo IM Android app entirely in the cloud — no Android Studio, no Mac,
# nothing to install on your computer. Run it from the GitHub "Actions" tab
# (Run workflow), or push a tag like v1.0.0 to also publish a downloadable Release.
#
# It always produces a DEBUG apk (sideloadable immediately, zero setup).
# If you add the four signing secrets (see README-BUILD.md § GitHub Actions), it also
# produces a SIGNED RELEASE apk suitable for wider distribution / Play closed testing.

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to attach the APK to a Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Exposed at job level so the `if:` conditionals below can detect whether
      # signing / FCM are configured. Empty (unset secret) → that step is skipped.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR="$(ls "$SDKROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          echo "Using sdkmanager at: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      # Native push (FCM) — only wired when the Firebase config secret is set.
      # Without it the APK still builds fine; push just stays inactive until you add it.
      - name: Configure FCM (Android)
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON != '' }}
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          echo "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # add the google-services classpath to the project build.gradle (once)
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i '/dependencies {/a\        classpath '"'"'com.google.gms:google-services:4.4.2'"'"'' android/build.gradle
          fi
          # apply the plugin in the app build.gradle (once)
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            printf '\napply plugin: '"'"'com.google.gms.google-services'"'"'\n' >> android/app/build.gradle
          fi

      - name: Build DEBUG APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload DEBUG APK
        uses: actions/upload-artifact@v4
        with:
          name: halo-im-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- Optional signed release (only runs if signing secrets are present) ----
      - name: Decode keystore
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "have_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build SIGNED RELEASE APK
        if: ${{ steps.keystore.outputs.have_keystore == 'true' }}
        working-directory: android
        env:
          KSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="$KSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload SIGNED RELEASE APK
        if: ${{ steps.keystore.outputs.have_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: halo-im-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ---- Publish the APK(s) as a downloadable GitHub Release ----
      # Runs on BOTH a manual "Run workflow" and a version tag. On a tag it uses the
      # tag name; on a manual run it creates/updates the "v1.0.0" release. Either way
      # the newest build is attached to the Latest release, which is what the portal's
      # /download/halo-im.apk link points at (…/releases/latest/download/app-debug.apk).
      - name: Publish / update the download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: Halo IM ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          make_latest: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: false
          body: |
            Halo IM Android build.
            • `app-debug.apk` — sideload now (Settings → allow install from this source).
            • `app-release.apk` — present only if signing secrets are configured.
            The app loads the live messenger, so day-to-day website updates appear automatically.
