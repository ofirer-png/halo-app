name: Build Halo IM Android APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR="$(ls "$SDKROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          echo "Using sdkmanager at: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Configure FCM (Android)
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON != '' }}
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          echo "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i '/dependencies {/a\        classpath '"'"'com.google.gms:google-services:4.4.2'"'"'' android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            printf '\napply plugin: '"'"'com.google.gms.google-services'"'"'\n' >> android/app/build.gradle
          fi

      - name: Build DEBUG APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload DEBUG APK
        uses: actions/upload-artifact@v4
        with:
          name: halo-im-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
